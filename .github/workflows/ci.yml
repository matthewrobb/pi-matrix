name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The host TUI package is a peer dependency, deliberately not a
      # dependency, so the test installs it without saving it.
      - run: npm install --no-save @earendil-works/pi-tui@1

      - run: npm test